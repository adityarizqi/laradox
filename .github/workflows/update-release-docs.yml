name: Update Release Documentation

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-docs:
    # Prereleases are not part of the changelog history.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      # A release event checks out the tag by default, which is a detached HEAD
      # and so cannot be pushed. Checking out the default branch instead is what
      # lets this commit the changelog directly rather than opening a pull
      # request for a file it already generated.
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update CHANGELOG.md
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a release body can never be executed as shell.
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ['RELEASE_TAG'].lstrip('v')
          date = os.environ['PUBLISHED_AT'][:10]

          # GitHub stores release bodies with CRLF line endings; normalising here
          # keeps CHANGELOG.md from drifting into mixed line endings.
          body = os.environ.get('RELEASE_BODY', '').replace('\r\n', '\n').strip()

          # Release bodies use h2 for sections like "What's Changed", which would
          # otherwise sit at the same level as the version headings themselves.
          body = re.sub(r'(?m)^## (?!#)', '### ', body)

          path = 'CHANGELOG.md'
          changelog = open(path, encoding='utf-8').read()

          if re.search(rf'(?m)^## {re.escape(version)} - ', changelog):
              print(f'CHANGELOG.md already documents {version}; leaving it alone.')
              sys.exit(0)

          lines = changelog.splitlines(keepends=True)

          unreleased = next(
              (i for i, line in enumerate(lines) if line.startswith('## [Unreleased]')),
              None,
          )
          if unreleased is None:
              sys.exit('Could not find the "## [Unreleased]" anchor in CHANGELOG.md')

          # Insert *after* the whole Unreleased section rather than immediately
          # below its heading, so notes already staged there stay under
          # Unreleased instead of being absorbed into this release.
          insert_at = next(
              (i for i in range(unreleased + 1, len(lines)) if lines[i].startswith('## ')),
              len(lines),
          )

          entry = f'## {version} - {date}\n'
          if body:
              entry += f'\n{body}\n'

          head = ''.join(lines[:insert_at]).rstrip('\n')
          tail = ''.join(lines[insert_at:])
          open(path, 'w', encoding='utf-8').write(
              f'{head}\n\n{entry}\n{tail}' if tail else f'{head}\n\n{entry}'
          )

          print(f'Inserted {version} ({date}) into CHANGELOG.md')
          PY

      - name: Commit and push
        id: commit
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add changelog entry for ${TAG} [skip ci]"

          # The branch may have moved on while the release was being published.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected, rebasing onto ${BRANCH} (attempt ${attempt})..."
            git pull --rebase --autostash origin "${BRANCH}"
          done

          echo "Could not push the changelog update after 3 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release Documentation Update"
            echo ""
            echo "- **Release**: ${{ github.event.release.tag_name }}"
            echo "- **Branch**: ${{ github.event.repository.default_branch }}"
            if [ "${{ steps.commit.outputs.committed }}" = "true" ]; then
              echo ""
              echo "✅ CHANGELOG.md updated and pushed."
            else
              echo ""
              echo "ℹ️ CHANGELOG.md already up to date; nothing committed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

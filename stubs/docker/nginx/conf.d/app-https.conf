upstream frankenphp_backend {
    server php:${LARADOX_FRANKENPHP_PORT};

    # Reuse upstream connections instead of paying for a TCP handshake per
    # request; recycled after 1000 requests to spread reconnects over time.
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Redirect HTTP to HTTPS for allowed domains
server {
    listen 80;
    listen [::]:80;
    server_name ${LARADOX_DOMAIN};
    return 301 https://$host$request_uri;
}

# Block HTTP access for all other domains
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 403;
}

# HTTPS Server for allowed domains
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${LARADOX_DOMAIN};

    client_max_body_size 25m;
    keepalive_timeout 75s;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Favicons and robots.txt are requested constantly and are noisy when absent
    location = /favicon.ico {
        proxy_pass http://frankenphp_backend;
        log_not_found off;
        access_log off;
    }

    location / {
        proxy_pass http://frankenphp_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

# Block HTTPS access for other domains
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    return 403;
}

upstream frankenphp_backend {
    server php:${LARADOX_FRANKENPHP_PORT};

    # Reuse upstream connections instead of paying for a TCP handshake per
    # request; recycled after 1000 requests to spread reconnects over time.
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# HTTP Server for allowed domains
server {
    listen 80;
    listen [::]:80;
    server_name ${LARADOX_DOMAIN};

    client_max_body_size 25m;
    keepalive_timeout 75s;

    # Favicons and robots.txt are requested constantly and are noisy when absent
    location = /favicon.ico {
        proxy_pass http://frankenphp_backend;
        log_not_found off;
        access_log off;
    }

    location / {
        proxy_pass http://frankenphp_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

# Block HTTP access for all other domains
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 403;
}

worker_processes auto;
worker_rlimit_nofile 100000;
error_log /var/log/nginx/error.log crit;
pcre_jit on;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Do not advertise the nginx version in responses or error pages
    server_tokens off;
    types_hash_max_size 4096;

    # File descriptor caching
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Logging
    access_log off;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeout and connection handling
    reset_timedout_connection on;
    client_header_timeout 10;
    client_body_timeout 10;
    client_body_buffer_size 128k;
    send_timeout 5;
    keepalive_timeout 30;
    keepalive_requests 10000;

    # Gzip compression (off because Caddy handles it)
    gzip off;

    # Proxy defaults, inherited by every server block. Buffering lets nginx
    # release the FrankenPHP worker as soon as the response is read, instead of
    # holding it open for the duration of a slow client.
    proxy_http_version 1.1;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Upgrade requests (WebSockets, Vite HMR) need "Connection: upgrade";
    # everything else must send an empty value to keep the upstream connection
    # pool alive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Include server blocks
    include /etc/nginx/conf.d/*.conf;
}
